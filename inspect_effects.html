<!doctype html>
<html><head><meta charset="utf-8"><title>Inspect Effects Sheet</title></head>
<body>
<img id="sheet" src="images/effects_sheet.png" crossorigin="anonymous" style="max-width:100%;" />
<pre id="out"></pre>
<script>
const img = document.getElementById('sheet');
img.addEventListener('load', () => {
  const canvas = document.createElement('canvas');
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  const visible = (x,y) => data[(y*canvas.width+x)*4+3] > 10;
  const rows = Array(canvas.height).fill(false);
  for (let y=0; y<canvas.height; y++) for (let x=0; x<canvas.width; x++) if (visible(x,y)) { rows[y] = true; break; }
  let regions=[];
  let s=-1;
  for (let y=0; y<rows.length; y++) {
    if (rows[y] && s<0) s=y;
    if (!rows[y] && s>=0) { regions.push([s,y]); s=-1; }
  }
  if (s>=0) regions.push([s,rows.length]);
  const out=[];
  out.push('size '+canvas.width+'x'+canvas.height);
  out.push('regions '+JSON.stringify(regions));
  regions.forEach(([y0,y1]) => {
    let col = Array(canvas.width).fill(false);
    for (let x=0; x<canvas.width; x++) {
      for (let y=y0; y<y1; y++) if (visible(x,y)) { col[x]=true; break; }
    }
    let sx=-1;
    for (let x=0; x<col.length; x++) {
      if (col[x] && sx<0) sx=x;
      if (!col[x] && sx>=0) { out.push('row '+y0+'-'+y1+' box '+sx+'-'+x); sx=-1; }
    }
    if (sx>=0) out.push('row '+y0+'-'+y1+' box '+sx+'-'+col.length);
  });
  document.getElementById('out').textContent = out.join('\n');
});
</script>
</body></html>
